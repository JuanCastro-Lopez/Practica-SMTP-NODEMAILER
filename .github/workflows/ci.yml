name: CI

on:
  push:
    branches:
      - main
      - Pruebas_jhoan
  pull_request:
    branches:
      - main
      - Pruebas_jhoan

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run integration tests
        run: npm run test:e2e -- --runInBand

      - name: Validate code
        run: npx eslint "src/**/*.spec.ts" "test/**/*.ts"
